[package]
name = "opsecmap"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "In-memory Rust model and scenario evaluator for account access dependencies"
authors = ["onyks"]
license = "AGPL-3.0-or-later"
readme = "README.md"
repository = "https://github.com/onyks-os/OpSecMap"
homepage = "https://github.com/onyks-os/OpSecMap"
documentation = "https://github.com/onyks-os/OpSecMap/tree/main/docs"
keywords = ["OpSecMap"]
categories = []
exclude = ["docs/", ".github/", "tests/fixtures/"]

[dependencies]
# TODO(template): declare runtime dependencies, then record each one in DEPENDENCIES.md.

[dev-dependencies]
proptest = "1"

[profile.release]
# Fail loudly rather than wrap silently: an integer overflow in release mode is
# a correctness bug, not a performance optimization.
overflow-checks = true
lto = true
codegen-units = 1
strip = "symbols"

# ---------------------------------------------------------------------------
# Lints — enforced by `cargo clippy -- -D warnings` in CI.
# ---------------------------------------------------------------------------
[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Panicking paths are banned in library code: a library that panics takes the
# caller's process down with it.
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
# Project names, acronyms, and file names appear constantly in doc comments and
# are not code; pedantic's doc_markdown would flag every one of them.
doc_markdown = "allow"

# Module: pkg-deb
# `make package-deb` builds the .deb with cargo-deb from this table.
# https://github.com/kornelski/cargo-deb#configuration
[package.metadata.deb]
maintainer = "onyks <onyks@protonmail.com>"
copyright = "2026, onyks"
section = "utils"
priority = "optional"
extended-description = "In-memory Rust model and scenario evaluator for account access dependencies. The CLI currently runs a fixed example."
# $auto: the shared libraries the binary links, resolved by dpkg-shlibdeps.
depends = "$auto"
assets = [
    ["target/release/opsecmap", "usr/bin/", "755"],
    ["README.md", "usr/share/doc/opsecmap/", "644"],
    ["LICENSE", "usr/share/doc/opsecmap/", "644"],
]

# Module: pkg-rpm
# `make package-rpm` builds the .rpm with cargo-generate-rpm from this table.
# https://github.com/cat-in-136/cargo-generate-rpm#configuration
[package.metadata.generate-rpm]
summary = "In-memory account access dependency evaluator"
release = "1"
assets = [
    { source = "target/release/opsecmap", dest = "/usr/bin/opsecmap", mode = "755" },
    { source = "README.md", dest = "/usr/share/doc/opsecmap/README.md", mode = "644", doc = true },
    { source = "LICENSE", dest = "/usr/share/licenses/opsecmap/LICENSE", mode = "644", doc = true },
]
