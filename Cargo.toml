[package]
name = "opsecmap"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "In-memory Rust model and scenario evaluator for account access dependencies"
authors = ["onyks"]
license = "AGPL-3.0-or-later"
readme = "README.md"
repository = "https://github.com/onyks-os/OpSecMap"
homepage = "https://github.com/onyks-os/OpSecMap"
documentation = "https://github.com/onyks-os/OpSecMap/tree/main/docs"
keywords = ["opsec", "security", "account-recovery", "dependency-graph", "cli"]
categories = ["command-line-utilities"]
exclude = ["docs/", ".github/", "tests/fixtures/"]

[dependencies]
# Encrypted map files: Argon2id turns the password into a key, XChaCha20-Poly1305
# encrypts and authenticates the map. Default features are off: the salt and
# nonce come from `getrandom` directly, and password hashing strings are unused.
argon2 = { version = "0.6", default-features = false, features = ["alloc"] }
chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc"] }
getrandom = "0.4"
# Reads the map password from the terminal without echoing it.
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Clears passwords, keys and decrypted maps from memory when they are dropped.
zeroize = "1"

[dev-dependencies]
proptest = "1"

# Argon2 is slow on purpose; unoptimized, each key derivation in a debug build
# or test takes seconds instead of a fraction of one.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

[profile.release]
# Fail loudly rather than wrap silently: an integer overflow in release mode is
# a correctness bug, not a performance optimization.
overflow-checks = true
lto = true
codegen-units = 1
strip = "symbols"

# ---------------------------------------------------------------------------
# Lints — enforced by `cargo clippy -- -D warnings` in CI.
# ---------------------------------------------------------------------------
[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Panicking paths are banned in library code: a library that panics takes the
# caller's process down with it.
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
# Project names, acronyms, and file names appear constantly in doc comments and
# are not code; pedantic's doc_markdown would flag every one of them.
doc_markdown = "allow"

# Module: pkg-deb
# `make package-deb` builds the .deb with cargo-deb from this table.
# https://github.com/kornelski/cargo-deb#configuration
[package.metadata.deb]
maintainer = "onyks <onyks@protonmail.com>"
copyright = "2026, onyks"
section = "utils"
priority = "optional"
extended-description = "Describe accounts, devices and recovery material as a map of access routes, then evaluate which resources remain reachable after a loss. The CLI reads commands from standard input and keeps the map in memory."
# $auto: the shared libraries the binary links, resolved by dpkg-shlibdeps.
depends = "$auto"
assets = [
    ["target/release/opsecmap", "usr/bin/", "755"],
    ["README.md", "usr/share/doc/opsecmap/", "644"],
    ["LICENSE", "usr/share/doc/opsecmap/", "644"],
]

# Module: pkg-rpm
# `make package-rpm` builds the .rpm with cargo-generate-rpm from this table.
# https://github.com/cat-in-136/cargo-generate-rpm#configuration
[package.metadata.generate-rpm]
summary = "In-memory account access dependency evaluator"
release = "1"
assets = [
    { source = "target/release/opsecmap", dest = "/usr/bin/opsecmap", mode = "755" },
    { source = "README.md", dest = "/usr/share/doc/opsecmap/README.md", mode = "644", doc = true },
    { source = "LICENSE", dest = "/usr/share/licenses/opsecmap/LICENSE", mode = "644", doc = true },
]
