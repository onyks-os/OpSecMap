name: Verify release

# Verifies a release from what is published, the way a user would: every asset
# against its Sigstore bundle and this repository's workflow identity at that
# tag, SHA256SUMS, and every registry the project publishes to serving the
# signed bytes (scripts/verify-release.d/). The release job checks its own files
# before signing; this checks what reached users, after the fact, and keeps
# checking:
#
# - after every release workflow that succeeded (workflow_run, because a release
#   created with GITHUB_TOKEN emits no `release` event to other workflows);
#   names listed here that the repository does not have simply never fire;
# - weekly, on the latest release: an asset replaced on the release page later
#   fails its signature here, instead of waiting for a user to notice;
# - on demand, for any tag.

on:
  workflow_run:
    workflows: ["Release", "Package (deb)", "Package (rpm)", "Package (Arch)", "Package (Flatpak)",
                "Publish (PyPI)", "Publish (npm)", "Publish (crates.io)"]
    types: [completed]
  schedule:
    - cron: "41 5 * * 3"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to verify (default: the latest release)"
        required: false

permissions:
  contents: read

concurrency:
  group: verify-release
  cancel-in-progress: false

jobs:
  verify:
    name: Verify the published release
    # The package workflows also run on pull requests; only a successful run for
    # a pushed v* tag has published anything to verify.
    if: >-
      github.event_name != 'workflow_run' || (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        startsWith(github.event.workflow_run.head_branch, 'v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read   # the registry hooks ask whether their publication has finished
    steps:
      # The default branch's scripts, never the triggering run's code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install the Sigstore client
        run: pip install "sigstore==4.5.0"

      # Values from the event go through env, never into the script text.
      - name: Resolve the tag to verify
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          RUN_REF: ${{ github.event.workflow_run.head_branch }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          tag=""
          case "$EVENT" in
            workflow_run) tag="$RUN_REF" ;;
            workflow_dispatch) tag="$INPUT_TAG" ;;
          esac
          if [ -z "$tag" ]; then
            tag="$(gh release view -R "$GITHUB_REPOSITORY" --json tagName --jq .tagName)"
          fi
          case "$tag" in
            v[0-9]*) ;;
            *) echo "::error::Not a release tag: $tag"; exit 1 ;;
          esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Verifying $tag"

      - name: Verify signatures, checksums and registries
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: scripts/verify-release.sh "$TAG" release-assets
