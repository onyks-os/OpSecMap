name: Package (Flatpak)

# Builds a single-file Flatpak bundle in Flathub's CI image, runs it in its sandbox, and
# publishes it signed.
#
# - pull requests that touch the packaging, and on demand: build, install in
#   clean containers, describe — nothing is published;
# - a v* tag: the same, then sign the package and its SBOM with Sigstore and
#   attach them to the GitHub Release that release.yml creates.
#
# docs/packaging.md explains the whole packaging set-up.

on:
  push:
    tags: ['v*']
  pull_request:
    branches: ["main"]
    paths:
      - 'packaging/flatpak/**'
      - '.github/workflows/package-flatpak.yml'
      - 'make/features/pkg-flatpak*.mk'
      - 'Cargo.toml'
      - 'Cargo.lock'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build with flatpak-builder
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08@sha256:c91a88269eee8fcdd73ecf43064232fbebe27411f926f63f38bdf70c51f2ceae
      # flatpak-builder creates the build sandbox with bubblewrap.
      options: --privileged
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0   # SOURCE_DATE_EPOCH is the tagged commit's time

      - name: Build, and run once in the sandbox
        run: |
          git config --global --add safe.directory "$PWD"
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          make package-flatpak

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: flatpak-build
          path: |
            dist/*.flatpak
          if-no-files-found: error
          retention-days: 3

  check:
    name: Describe
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0   # SOURCE_DATE_EPOCH is the tagged commit's time

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: flatpak-build
          path: dist/

      - name: Write and validate its SBOM
        run: make sbom-files FILES="$(ls dist/*.flatpak)"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: flatpak
          path: |
            dist/
          if-no-files-found: error
          retention-days: 3

  # Only for a tag, and only after the package was built, installed and
  # described. Signed here, by this workflow: its identity is
  # .github/workflows/package-flatpak.yml@refs/tags/<tag>, which scripts/verify-release.sh and
  # docs/packaging.md accept for this package.
  publish:
    name: Sign and attach to the release
    if: startsWith(github.ref, 'refs/tags/')
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write   # attach the package to the release
      id-token: write   # Sigstore keyless signing
      actions: read     # scripts/release-wait.sh stops early if the Release run failed
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false


      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: flatpak
          path: dist/

      - name: Sign with Sigstore
        uses: sigstore/gh-action-sigstore-python@790bc6befb9d733738f18d8f895854b453640ec9 # v3.5.0
        with:
          inputs: dist/*

      # release.yml creates the release; this workflow started on the same tag
      # push, so it waits for it rather than racing it.
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/release-wait.sh "$GITHUB_REF_NAME"
          gh release upload "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --clobber dist/*
