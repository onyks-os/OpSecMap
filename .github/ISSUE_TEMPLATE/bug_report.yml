name: 🐛 Bug report
description: Report something that does not work as documented
title: "[Bug] "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a report.

        **Do not use this form for security vulnerabilities.** Report those privately through
        [GitHub Security Advisories](https://github.com/onyks-os/OpSecMap/security/advisories/new).

  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
        - label: I reproduced it on the latest commit of `main` (there is no published release yet).
          required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: The commit SHA (`git rev-parse --short HEAD`) or the output of `opsecmap --version`.
      placeholder: "bc6694c"
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system, distribution, and Rust version.
      placeholder: "Fedora 43, Rust 1.88"
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: The minimal sequence that triggers the bug. For the CLI, the shortest list of commands that reproduces it. Use fictional resource names, never your real accounts.
      placeholder: |
        resource phone Test phone
        evaluate phone -
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs and output
      description: Full output of the failing command. This is automatically formatted as code.
      render: shell
