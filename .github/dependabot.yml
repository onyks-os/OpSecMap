version: 2
updates:
  # Keep GitHub Actions pinned references fresh. Required for a good
  # OpenSSF Scorecard "Pinned-Dependencies" and "Dependency-Update-Tool" score.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
      - "ci"
    # One pull request for all action updates. Without a group, each action path
    # gets its own PR, which splits families that must move together: the
    # github/codeql-action init, autobuild, analyze and upload-sarif steps have
    # to run the same version.
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "deps"
      prefix-development: "deps-dev"
    labels:
      - "dependencies"
    groups:
      dev-dependencies:
        dependency-type: "development"
  # The documentation toolchain pinned in docs/requirements.txt.
  - package-ecosystem: "pip"
    directory: "/docs"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "docs"
    labels:
      - "dependencies"
      - "documentation"
